[project]
name = "music-gen"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.10.19"
dependencies = [
    "abjad>=3.19",
    "librosa",
    "matplotlib",
    "midiutil",
    "mido",
    "numpy",
    "pydantic>=2.12.5",
    "pygame-ce>=2.5.6",
    "pynput>=1.8.1",
    "python-ly>=0.9.9",
    "python-rtmidi>=1.5.8",
    "scamp>=0.9.2.post3",
    "scamp-extensions>=0.3.5.post2",
    "scipy",
    "taskipy>=1.14.1",
]

[dependency-groups]
dev = [
    "black>=25.12.0",
    "isort>=7.0.0",
    "pyinstaller>=6.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.10",
]
llm = [
    "faiss-cpu>=1.13.2",
    "langchain>=1.2.7",
    "langchain-community>=0.4.1",
    "langchain-openai>=1.1.7",
    "langchain-perplexity>=1.1.0",
    "langgraph>=1.0.6",
    "perplexipy>=1.3.1",
    "pypdf>=6.6.0",
    "python-dotenv>=1.2.1",
]


#######################################################
# LINTERS - RUFF | Isort | Black
#######################################################
[tool.ruff]
line-length = 120
lint.select = ["E", "F", "I"]
# select = ["A", "B", "C", "D", "E", "F", "I", "N", "PL", "RUF", "S", "T", "W"]
lint.fixable = ["ALL"]
lint.ignore = ["D203", "D213", "T201", "PLE1205","F403","F405"]
lint.per-file-ignores = {}
# Same as Black.

# Allow unused variables when underscore-prefixed.
lint.dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
exclude = [
    "tests/*",
    ".venv/*",
    "build",
    "dist",
    "node_modules"
]

# [tool.ruff.lint.pydocstyle]
# convertion="google"


[tool.black]
line-length = 120
extend-exclude='''
.temp-*
| venv
| .venv
'''

#######################################################
# Poetry Scripts & Taskipy
#######################################################
[tool.poetry.scripts]
syncro_git = "src.fix:syncro_git"

[tool.taskipy.tasks]
pre_lint = { cmd = "echo 'Black' && black .", help = "apply the black linter"}
lint = { cmd = "ruff check . --fix", help = "apply ruff linter"}
tree = "uv tree > .pip.tree"
build-merger = { cmd = "pyinstaller --onefile --name merger_midi src/merger_midi.py", help = "build merger_midi standalone exe"}
